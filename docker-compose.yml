services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: lundyseab/devops-portfolio:latest
    container_name: devops-portfolio
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
